workflows:
  android:
    name: Nexa Android APK
    max_build_duration: 120

    working_directory: frontend

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk